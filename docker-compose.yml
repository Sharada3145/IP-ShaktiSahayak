version: '3.8'

services:
  backend:
    build: 
      context: ./backend
    container_name: ipsakti_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/corpus:/app/corpus
      - chroma_data:/app/chroma_db
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: ipsakti_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  chroma_data:
